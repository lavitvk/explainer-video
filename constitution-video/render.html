<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "DejaVu Sans", sans-serif';

/* ---------- palette ---------- */
const C = {
  bg1: '#F7F9FC', bg2: '#E8EEF7', ink: '#0F172A', sub: '#475569', mute: '#94A3B8',
  navy: '#1E3A8A', active: '#DC2626', activeSoft: '#FEE2E2', latent: '#059669', latentSoft: '#D1FAE5',
  warn: '#D97706', warnSoft: '#FEF3C7', blue: '#2563EB', blueSoft: '#DBEAFE',
  H: '#0EA5E9', R: '#F97316', Z: '#A855F7', E: '#EAB308', bac: '#E11D48', cell: '#60A5FA'
};

/* ---------- math / easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eback = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const P = (t, s, d = .5) => clamp((t - s) / d);
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- primitives ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 600} ${o.size || 40}px ${FONT}`;
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function card(x, y, w, h, o = {}) {
  ctx.save();
  ctx.shadowColor = 'rgba(15,23,42,0.10)'; ctx.shadowBlur = o.blur ?? 30; ctx.shadowOffsetY = 10;
  rr(x, y, w, h, o.r ?? 28); ctx.fillStyle = o.fill || '#fff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  if (o.stroke) { ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.stroke; ctx.stroke(); }
  ctx.restore();
}
// scale-pop an element around (cx,cy)
function pop(k, cx, cy, fn, back = true) {
  if (k <= 0) return;
  const s = back ? eback(k) : eo(k);
  ctx.save(); ctx.globalAlpha *= clamp(k * 2.5);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  fn(); ctx.restore();
}
function fadeUp(k, fn, dy = 30) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= eo(k); ctx.translate(0, (1 - eo(k)) * dy); fn(); ctx.restore();
}
function check(cx, cy, s, color, k) {
  if (k <= 0) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.fillStyle = color; ctx.globalAlpha *= clamp(k * 3); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = s * .22;
  const pts = [[-.45, .02], [-.12, .35], [.48, -.32]];
  const kk = eo(k);
  ctx.beginPath(); ctx.moveTo(cx + pts[0][0] * s, cy + pts[0][1] * s);
  const seg1 = clamp(kk * 2), seg2 = clamp(kk * 2 - 1);
  ctx.lineTo(cx + lerp(pts[0][0], pts[1][0], seg1) * s, cy + lerp(pts[0][1], pts[1][1], seg1) * s);
  if (seg2 > 0) ctx.lineTo(cx + lerp(pts[1][0], pts[2][0], seg2) * s, cy + lerp(pts[1][1], pts[2][1], seg2) * s);
  ctx.stroke(); ctx.restore();
}
function cross(cx, cy, s, color, k) {
  if (k <= 0) return;
  ctx.save(); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.fillStyle = color; ctx.globalAlpha *= clamp(k * 3); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = s * .22; const a = s * .38, kk = eo(k);
  ctx.beginPath(); ctx.moveTo(cx - a, cy - a); ctx.lineTo(cx - a + 2 * a * clamp(kk * 2), cy - a + 2 * a * clamp(kk * 2)); ctx.stroke();
  if (kk > .5) { const k2 = clamp(kk * 2 - 1); ctx.beginPath(); ctx.moveTo(cx + a, cy - a); ctx.lineTo(cx + a - 2 * a * k2, cy - a + 2 * a * k2); ctx.stroke(); }
  ctx.restore();
}
function stamp(label, cx, cy, color, k, rot = -0.08, size = 110) {
  if (k <= 0) return;
  const s = k < 1 ? lerp(2.2, 1, eo(k)) : 1;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
  ctx.globalAlpha *= clamp(k * 2);
  ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(label).width + size * .9, h = size * 1.55;
  rr(-w / 2, -h / 2, w, h, 26); ctx.lineWidth = 14; ctx.strokeStyle = color; ctx.stroke();
  rr(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 16); ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 6);
  ctx.restore();
}
function arrow(x1, y1, x2, y2, k, color = C.sub, lw = 8) {
  if (k <= 0) return;
  const kk = eo(k), x = lerp(x1, x2, kk), y = lerp(y1, y2, kk);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), hs = lw * 3;
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * hs * .4, y + Math.sin(a) * hs * .4);
  ctx.lineTo(x - Math.cos(a - .5) * hs, y - Math.sin(a - .5) * hs);
  ctx.lineTo(x - Math.cos(a + .5) * hs, y - Math.sin(a + .5) * hs); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- illustrations ---------- */
function bacillus(x, y, len, ang, color = C.bac, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha *= alpha;
  const w = len * .32; rr(-len / 2, -w / 2, len, w, w / 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(-len / 2 + w * .3, -w / 2 + w * .18, len * .55, w * .22, w * .11); ctx.fill();
  ctx.restore();
}
function immuneCell(x, y, r, t, color = C.cell) {
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const a = i / 40 * Math.PI * 2;
    const rr2 = r * (1 + .06 * Math.sin(a * 5 + t * 3) + .04 * Math.sin(a * 3 - t * 2));
    const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * .1, y - r * .05, r * .42, 0, Math.PI * 2); ctx.fillStyle = 'rgba(30,58,138,.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * .35, y - r * .4, r * .16, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  ctx.restore();
}
function child(cx, cy, s, shirt = C.blue, mood = 'ok', t = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // body
  rr(-62, -10, 124, 150, 52); ctx.fillStyle = shirt; ctx.fill();
  // neck/head
  ctx.beginPath(); ctx.arc(0, -70, 58, 0, Math.PI * 2); ctx.fillStyle = '#F2C9A0'; ctx.fill();
  // hair
  ctx.beginPath(); ctx.arc(0, -82, 60, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(48, -95); ctx.quadraticCurveTo(0, -112, -50, -92); ctx.closePath();
  ctx.fillStyle = '#3F2A1D'; ctx.fill();
  // eyes
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(-20, -70, 6, 0, 7); ctx.arc(20, -70, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === 'sick') { ctx.moveTo(-14, -38); ctx.quadraticCurveTo(0, -48, 14, -38); }
  else { ctx.moveTo(-16, -44); ctx.quadraticCurveTo(0, -30, 16, -44); }
  ctx.stroke();
  if (mood === 'sick') { // flushed cheeks + sweat
    ctx.fillStyle = 'rgba(239,68,68,.35)'; ctx.beginPath(); ctx.ellipse(-34, -52, 12, 7, 0, 0, 7); ctx.ellipse(34, -52, 12, 7, 0, 0, 7); ctx.fill();
    const dy = (t * 40) % 40;
    ctx.fillStyle = '#7DD3FC'; ctx.globalAlpha *= 1 - dy / 40;
    ctx.beginPath(); ctx.moveTo(56, -100 + dy); ctx.quadraticCurveTo(66, -84 + dy, 56, -78 + dy); ctx.quadraticCurveTo(46, -84 + dy, 56, -100 + dy); ctx.fill();
  }
  ctx.restore();
}
function adult(cx, cy, s, shirt = '#64748B', t = 0, cough = false) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-80, -10, 160, 210, 64); ctx.fillStyle = shirt; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -78, 64, 0, 7); ctx.fillStyle = '#D9A877'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -92, 66, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath(); ctx.fillStyle = '#1F2937'; ctx.fill();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-22, -78, 6, 0, 7); ctx.arc(22, -78, 6, 0, 7); ctx.fill();
  if (cough) {
    ctx.beginPath(); ctx.ellipse(8, -44, 12, 10, 0, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
    // droplets with bacilli
    for (let i = 0; i < 6; i++) {
      const ph = ((t * .9 + i / 6) % 1);
      const dx = 80 + ph * 260, dy = -50 + Math.sin(i * 2.1) * 60 * ph;
      ctx.globalAlpha = (1 - ph) * .9;
      bacillus(dx, dy, 34, i, C.bac);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-16, -46); ctx.lineTo(16, -46); ctx.stroke();
  }
  ctx.restore();
}
function thermometer(cx, cy, s, level, hot = true) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-18, -110, 36, 170, 18); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 70, 34, 0, 7); ctx.fillStyle = hot ? C.active : C.blue; ctx.fill(); ctx.stroke();
  const top = lerp(50, -90, level);
  rr(-8, top, 16, 70 - top, 8); ctx.fillStyle = hot ? C.active : C.blue; ctx.fill();
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(18, -80 + i * 28); ctx.lineTo(4, -80 + i * 28); ctx.lineWidth = 4; ctx.stroke(); }
  ctx.restore();
}
function scaleIcon(cx, cy, s, k) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-90, -60, 180, 140, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -10, 48, Math.PI, 0); ctx.fillStyle = '#F1F5F9'; ctx.fill(); ctx.stroke();
  const a = Math.PI + lerp(1.9, .9, eo(k));
  ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(Math.cos(a) * 40, -10 + Math.sin(a) * 40); ctx.strokeStyle = C.active; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
  arrow(cx + 120 * s, cy - 60 * s, cx + 120 * s, cy + 50 * s, k, C.active, 9 * s);
}
function lungsPath(side, x, y, w, h) {
  // side: -1 = viewer-left lung (patient's RIGHT), +1 = viewer-right lung (patient's LEFT)
  const cx = x + w / 2, o = side;
  const inner = cx + o * w * .07, outer = cx + o * w * .40;
  const top = y + h * .12, bot = y + h * .86;
  ctx.beginPath();
  ctx.moveTo(inner, top + h * .06);
  ctx.bezierCurveTo(inner + o * w * .02, top - h * .05, outer - o * w * .10, top - h * .02, outer - o * w * .03, top + h * .25);
  ctx.bezierCurveTo(outer + o * w * .02, top + h * .45, outer + o * w * .02, bot - h * .10, outer - o * w * .01, bot);
  ctx.quadraticCurveTo(cx + o * w * .22, bot - h * (side < 0 ? .10 : .07), inner + o * w * (side > 0 ? .10 : .02), bot - h * .05);
  if (side > 0) ctx.quadraticCurveTo(inner + o * w * .12, y + h * .55, inner + o * w * .02, y + h * .45);
  ctx.lineTo(inner, top + h * .06);
  ctx.closePath();
}
function xray(x, y, w, h, o = {}) {
  ctx.save();
  rr(x, y, w, h, 18); ctx.fillStyle = '#05080F'; ctx.fill();
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  // soft tissue glow
  const g = ctx.createRadialGradient(x + w / 2, y + h * .55, w * .1, x + w / 2, y + h * .55, w * .62);
  g.addColorStop(0, '#5B6472'); g.addColorStop(.7, '#2A303A'); g.addColorStop(1, '#0B0F16');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  // lungs (dark = air)
  for (const sd of [-1, 1]) {
    lungsPath(sd, x, y, w, h);
    const lg = ctx.createLinearGradient(0, y, 0, y + h);
    lg.addColorStop(0, '#11151C'); lg.addColorStop(1, '#1B212B');
    ctx.fillStyle = lg; ctx.fill();
  }
  // vascular markings
  ctx.strokeStyle = 'rgba(160,170,185,.18)'; ctx.lineWidth = 2;
  for (const sd of [-1, 1]) for (let i = 0; i < 7; i++) {
    const hx = x + w / 2 + sd * w * .1, hy = y + h * .48;
    ctx.beginPath(); ctx.moveTo(hx, hy);
    const a = (-.9 + i * .3);
    ctx.quadraticCurveTo(hx + sd * w * .12, hy + a * h * .15, hx + sd * w * (.18 + .05 * (i % 3)), hy + a * h * .32); ctx.stroke();
  }
  // ribs
  ctx.strokeStyle = 'rgba(210,215,225,.28)'; ctx.lineWidth = Math.max(3, w * .012);
  for (let i = 0; i < 9; i++) {
    const ry = y + h * (.16 + i * .078);
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + w / 2 + sd * w * .05, ry);
      ctx.bezierCurveTo(x + w / 2 + sd * w * .30, ry - h * .06, x + w / 2 + sd * w * .44, ry + h * .02, x + w / 2 + sd * w * .40, ry + h * .12);
      ctx.stroke();
    }
  }
  // clavicles
  ctx.strokeStyle = 'rgba(225,230,238,.55)'; ctx.lineWidth = w * .02;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + w / 2 + sd * w * .04, y + h * .13); ctx.quadraticCurveTo(x + w / 2 + sd * w * .22, y + h * .07, x + w / 2 + sd * w * .38, y + h * .11); ctx.stroke(); }
  // spine + mediastinum
  const sg = ctx.createLinearGradient(x + w * .42, 0, x + w * .58, 0);
  sg.addColorStop(0, 'rgba(200,205,215,0)'); sg.addColorStop(.5, 'rgba(200,205,215,.55)'); sg.addColorStop(1, 'rgba(200,205,215,0)');
  ctx.fillStyle = sg; ctx.fillRect(x + w * .42, y, w * .16, h);
  // heart
  ctx.beginPath(); ctx.ellipse(x + w * .56, y + h * .66, w * .17, h * .16, -.35, 0, 7);
  ctx.fillStyle = 'rgba(200,205,215,.30)'; ctx.fill();
  // consolidation in patient's RIGHT upper lobe (viewer's LEFT, upper zone)
  const cons = o.cons || 0;
  if (cons > 0) {
    ctx.save(); lungsPath(-1, x, y, w, h); ctx.clip();
    const pulse = o.pulse ? (0.85 + .15 * Math.sin(o.t * 4)) : 1;
    const cxx = x + w * .30, cyy = y + h * .27;
    const rg = ctx.createRadialGradient(cxx, cyy, 4, cxx, cyy, w * .20 * eo(cons));
    rg.addColorStop(0, `rgba(240,242,246,${.85 * pulse})`); rg.addColorStop(.6, `rgba(215,220,228,${.55 * pulse})`); rg.addColorStop(1, 'rgba(200,205,215,0)');
    ctx.fillStyle = rg; ctx.fillRect(x, y, w, h);
    // horizontal fissure line hint
    ctx.strokeStyle = `rgba(235,238,242,${.5 * eo(cons)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + w * .13, y + h * .40); ctx.quadraticCurveTo(x + w * .28, y + h * .42, x + w * .42, y + h * .40); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // marker
  txt('R', x + 34, y + 38, { size: Math.max(22, w * .06), weight: 800, color: '#FDE68A' });
  ctx.restore();
}
function forearm(cx, cy, s, k) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-190, -55, 380, 110, 55); ctx.fillStyle = '#E8B98C'; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.06)'; rr(-190, 10, 380, 45, 30); ctx.fill();
  // induration
  const r = 44 * eo(k);
  if (r > 0) {
    ctx.beginPath(); ctx.ellipse(0, -5, r, r * .8, 0, 0, 7); ctx.fillStyle = 'rgba(220,38,38,.35)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -5, r * .55, r * .45, 0, 0, 7); ctx.fillStyle = 'rgba(220,38,38,.45)'; ctx.fill();
    // ruler
    ctx.globalAlpha *= clamp(k * 2 - 1);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-r, -78); ctx.lineTo(r, -78); ctx.moveTo(-r, -90); ctx.lineTo(-r, -66); ctx.moveTo(r, -90); ctx.lineTo(r, -66); ctx.stroke();
    txt('≥ 10 mm', 0, -112, { size: 30, weight: 700, color: C.ink });
  }
  ctx.restore();
}
function tube(cx, cy, s, k) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-34, -150, 68, 40, 10); ctx.fillStyle = '#7C3AED'; ctx.fill();
  rr(-28, -115, 56, 230, 28); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#94A3B8'; ctx.stroke();
  const lvl = lerp(110, -40, eo(k));
  ctx.save(); rr(-28, -115, 56, 230, 28); ctx.clip();
  ctx.fillStyle = '#B91C1C'; ctx.fillRect(-30, lvl, 60, 200);
  ctx.fillStyle = '#FCD34D'; ctx.fillRect(-30, lvl, 60, 40 * eo(k));
  ctx.restore();
  rr(-30, -40, 60, 70, 6); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  txt('IFN-γ', 0, -5, { size: 17, weight: 800, color: C.navy });
  ctx.restore();
}
function pill(cx, cy, letter, color, s = 1) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.15)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
  ctx.beginPath(); ctx.arc(0, 0, 42, 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(-12, -14, 12, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  txt(letter, 0, 3, { size: 44, weight: 900, color: '#fff' });
  ctx.restore();
}
function iconBadge(cx, cy, r, color, soft, draw) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = soft; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = color; ctx.stroke(); ctx.restore(); draw && draw();
}
function bodySilhouette(cx, cy, s, glow) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = '#CBD5E1';
  ctx.beginPath(); ctx.arc(0, -250, 70, 0, 7); ctx.fill();
  rr(-34, -190, 68, 50, 20); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-150, -150); ctx.quadraticCurveTo(0, -175, 150, -150);
  ctx.lineTo(170, 70); ctx.quadraticCurveTo(150, 120, 120, 80);
  ctx.lineTo(100, -40); ctx.lineTo(95, 250); ctx.lineTo(-95, 250); ctx.lineTo(-100, -40);
  ctx.lineTo(-120, 80); ctx.quadraticCurveTo(-150, 120, -170, 70); ctx.closePath(); ctx.fill();
  // lungs
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sd * 48, -60, 40, 75, sd * .1, 0, 7);
    ctx.fillStyle = `rgba(251,113,133,${.55 + .3 * glow})`; ctx.fill();
  }
  ctx.restore();
}

/* ---------- background, header, subtitles ---------- */
function background(T) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(30,58,138,.05)';
  for (let x = 40; x < W; x += 60) for (let y = 40; y < H; y += 60) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); }
  // floating decorative bacilli very faint
  for (let i = 0; i < 6; i++) {
    const bx = (i * 377 + T * 12) % (W + 200) - 100, by = 160 + (i * 211) % 700 + Math.sin(T * .6 + i) * 20;
    bacillus(bx, by, 50, i + T * .2, 'rgba(225,29,72,.05)');
  }
}
function header(label, accent = C.navy) {
  rr(60, 44, 18, 54, 9); ctx.fillStyle = accent; ctx.fill();
  txt(label, 96, 72, { size: 34, weight: 800, color: C.ink, align: 'left' });

function wrap(s, maxW) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (ctx.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t2; }
  if (cur) lines.push(cur); return lines;
}
function subtitle(s, k) {
  if (!s || k <= 0) return;
  ctx.save(); ctx.globalAlpha *= eo(k);
  ctx.font = `600 38px ${FONT}`;
  const lines = wrap(s, 1500), lh = 50, bh = lines.length * lh + 36;
  const by = H - 40 - bh;
  ctx.fillStyle = 'rgba(15,23,42,.86)'; rr(W / 2 - 800, by, 1600, bh, 22); ctx.fill();
  lines.forEach((l, i) => txt(l, W / 2, by + 18 + lh / 2 + i * lh, { size: 38, weight: 600, color: '#F8FAFC' }));
  ctx.restore();
}

/* ================= NEPHROLOGY: extra palette + illustrations ================= */
C.kid = '#7C3AED'; C.kidSoft = '#EDE9FE';
C.ok = '#059669'; C.okSoft = '#D1FAE5';

// background without TB bacilli: soft drifting kidney-pink circles
function background(T) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(30,58,138,.05)';
  for (let x = 40; x < W; x += 60) for (let y = 40; y < H; y += 60) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); }
  for (let i = 0; i < 5; i++) {
    const bx = (i * 431 + T * 10) % (W + 200) - 100, by = 180 + (i * 233) % 700 + Math.sin(T * .5 + i) * 20;
    ctx.beginPath(); ctx.arc(bx, by, 40 + i * 6, 0, 7); ctx.fillStyle = 'rgba(124,58,237,.035)'; ctx.fill();
  }
}

// seeded random for deterministic textures
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function para(lines, x, y, o = {}) {
  lines.forEach((l, i) => txt(l, x, y + i * (o.lh || (o.size || 32) * 1.35), o));
}

function kidneyPath(cx, cy, s, flip = 1) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s * flip, s);

  ctx.bezierCurveTo(-45, 68, -52, 30, -22, 12);
  ctx.quadraticCurveTo(-10, 0, -22, -12);

  ctx.restore();
}
function kidney(cx, cy, s, flip = 1, fill = '#C2410C', stroke = '#7C2D12') {
  ctx.save();

  const g = ctx.createRadialGradient(cx + 10 * s * flip, cy - 20 * s, 5, cx, cy, 80 * s);
  g.addColorStop(0, '#FB923C'); g.addColorStop(1, fill);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5 * s; ctx.strokeStyle = stroke; ctx.stroke();

// DMSA scan panel: posterior view, two kidneys with radiotracer; scars = photopenic cortical defects
function dmsa(x, y, w, h, scarK = 0, t = 0) {
  ctx.save();
  rr(x, y, w, h, 18); ctx.fillStyle = '#020617'; ctx.fill();
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  const s = Math.min(w, h) / 360;
  const ks = [[x + w * .32, y + h * .5, -1], [x + w * .68, y + h * .5, 1]];
  ks.forEach(([kx, ky, f], i) => {
    ctx.save(); kidneyPath(kx, ky, s * 1.35, f);
    const g = ctx.createRadialGradient(kx, ky, 4, kx, ky, 95 * s * 1.35);
    g.addColorStop(0, '#7C2D12'); g.addColorStop(.45, '#F97316'); g.addColorStop(.8, '#FDE047'); g.addColorStop(1, '#FEF9C3');
    ctx.fillStyle = g; ctx.fill(); ctx.clip();
    // speckle noise
    const r = rng(11 + i); ctx.fillStyle = 'rgba(0,0,0,.18)';
    for (let k = 0; k < 160; k++) { ctx.beginPath(); ctx.arc(kx - 90 * s + r() * 180 * s, ky - 110 * s + r() * 220 * s, 2 + r() * 2, 0, 7); ctx.fill(); }
    if (i === 0 && scarK > 0) {
      // scars at upper & lower pole (outer cortex)
      ctx.fillStyle = `rgba(2,6,23,${.92 * eo(scarK)})`;
      ctx.beginPath(); ctx.ellipse(kx + 34 * s * 1.35 * f, ky - 60 * s * 1.35, 52 * s, 36 * s, .5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(kx + 46 * s * 1.35 * f, ky + 48 * s * 1.35, 40 * s, 30 * s, -.5, 0, 7); ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
  txt('L', x + 30, y + 34, { size: 26, weight: 800, color: '#FDE68A' });
  txt('R', x + w - 30, y + 34, { size: 26, weight: 800, color: '#FDE68A' });
  txt('posterior', x + w / 2, y + h - 26, { size: 22, weight: 600, color: '#94A3B8' });
  ctx.restore();
}

// Ultrasound fan image with kidney (hydronephrosis optional)
function ultrasound(x, y, w, h, hydro = 0) {
  ctx.save();

// MCU: bladder + ureters + kidneys; contrast refluxes up (k 0..1)
function mcu(cx, cy, s, k) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // kidneys outline
  for (const sd of [-1, 1]) { kidneyPath(sd * 120, -170, .75, sd); ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 6; ctx.stroke(); }
  // ureters
  for (const sd of [-1, 1]) {
    ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sd * 100, -150); ctx.bezierCurveTo(sd * 90, -40, sd * 60, 20, sd * 40, 80); ctx.stroke();
  }
  // bladder
  ctx.beginPath(); ctx.ellipse(0, 130, 110, 80, 0, 0, 7); ctx.fillStyle = '#1E3A8A'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14, 205); ctx.lineTo(14, 205); ctx.lineTo(8, 250); ctx.lineTo(-8, 250); ctx.closePath(); ctx.fill();
  txt('contrast', 0, 132, { size: 26, weight: 700, color: '#DBEAFE' });
  // reflux up left ureter
  if (k > 0) {
    ctx.strokeStyle = '#1E3A8A'; ctx.lineWidth = 14;
    const N = 40, kk = eo(k);
    ctx.beginPath();
    for (let i = 0; i <= N * kk; i++) {
      const u = 1 - i / N; // from bladder (u=1) upward (u=0)
      const bx = (1 - u) ** 3 * -100 + 3 * (1 - u) ** 2 * u * -90 + 3 * (1 - u) * u * u * -60 + u ** 3 * -40;
      const by = (1 - u) ** 3 * -150 + 3 * (1 - u) ** 2 * u * -40 + 3 * (1 - u) * u * u * 20 + u ** 3 * 80;
      i ? ctx.lineTo(bx, by) : ctx.moveTo(bx, by);
    }
    ctx.stroke();
    if (kk > .95) { ctx.save(); kidneyPath(-120, -170, .75, -1); ctx.clip(); ctx.beginPath(); ctx.ellipse(-110, -170, 30, 44, 0, 0, 7); ctx.fillStyle = 'rgba(30,58,138,.8)'; ctx.fill(); ctx.restore(); }
  }
  ctx.restore();
}

// baby with configurable skin (jaundice), smile on/off, flexion pose 0..1
function baby2(cx, cy, s, t, o = {}) {
  const skin = o.skin || '#F2C9A0', flex = o.flex || 0;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-70, 10, 140, 120, 55); ctx.fillStyle = o.shirt || '#93C5FD'; ctx.fill();
  rr(-60, 85, 120, 60, 28); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 4; ctx.stroke();
  // arms: rest -> flexed/raised during spasm (flex) then extended (o.ext)
  ctx.strokeStyle = skin; ctx.lineWidth = 34; ctx.lineCap = 'round';
  for (const sd of [-1, 1]) {
    const ext = o.ext || 0;
    const ang = lerp(lerp(.9, -.2, flex), -1.2, ext);
    ctx.beginPath(); ctx.moveTo(sd * 62, 30);
    ctx.lineTo(sd * (62 + Math.cos(ang) * 70), 30 + Math.sin(ang) * 70 * (ext > 0 ? 1 : 1)); ctx.stroke();
  }
  // head nods forward with flexion
  ctx.save(); ctx.translate(0, 14 * flex); ctx.rotate(0);
  ctx.beginPath(); ctx.arc(0, -70, 82, 0, 7); ctx.fillStyle = skin; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -138, 14, 0, 7); ctx.fillStyle = '#3F2A1D'; ctx.fill();
  ctx.fillStyle = C.ink;
  if (o.sclera) { ctx.fillStyle = '#FDE047'; ctx.beginPath(); ctx.ellipse(-28, -75, 15, 12, 0, 0, 7); ctx.ellipse(28, -75, 15, 12, 0, 0, 7); ctx.fill(); ctx.fillStyle = C.ink; }
  ctx.beginPath(); ctx.ellipse(-28, -75, 8, 10, 0, 0, 7); ctx.ellipse(28, -75, 8, 10, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
  if (o.smile === false) { ctx.moveTo(-14, -34); ctx.lineTo(14, -34); }
  else { ctx.moveTo(-16, -40); ctx.quadraticCurveTo(0, -24, 16, -40); }
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// coronal brain section; hl: 'bg' basal ganglia (bilirubin yellow), 'wm' periventricular white matter
function brainCoronal(cx, cy, s, hl = {}, t = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // hemispheres
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sd * 95, -10, 120, 150, 0, 0, 7); ctx.fillStyle = '#F9A8D4'; ctx.fill();
  }
  // cortex gyri edge
  ctx.strokeStyle = '#EC4899'; ctx.lineWidth = 5;
  for (const sd of [-1, 1]) for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + sd * (i * .32 - .2);
    const x = sd * 95 + Math.cos(a) * 112, y = -10 + Math.sin(a) * 140;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a) * 26, y - Math.sin(a) * 26); ctx.stroke();
  }
  // white matter
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 85, -5, 82, 112, 0, 0, 7); ctx.fillStyle = '#FDF2F8'; ctx.fill(); }
  if (hl.wm) {
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sd * 52, -40, 40, 52, sd * .3, 0, 7);
      ctx.fillStyle = `rgba(59,130,246,${.55 * hl.wm})`; ctx.fill();
    }
  }
  // lateral ventricles
  ctx.fillStyle = '#334155';
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 28, -42, 14, 40, sd * .35, 0, 7); ctx.fill(); }
  // basal ganglia (caudate/putamen + globus pallidus)
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sd * 72, 30, 26, 42, sd * -.2, 0, 7); ctx.fillStyle = '#C4B5FD'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(sd * 48, 34, 14, 28, sd * -.2, 0, 7); ctx.fillStyle = '#A78BFA'; ctx.fill();
    if (hl.bg) {
      const pulse = .8 + .2 * Math.sin(t * 4);
      const g = ctx.createRadialGradient(sd * 58, 32, 4, sd * 58, 32, 60);
      g.addColorStop(0, `rgba(250,204,21,${.95 * hl.bg * pulse})`); g.addColorStop(1, 'rgba(250,204,21,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sd * 58, 32, 60, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sd * 48, 34, 14, 28, sd * -.2, 0, 7); ctx.fillStyle = `rgba(234,179,8,${hl.bg})`; ctx.fill();
    }
  }
  // thalamus + third ventricle + brainstem
  ctx.fillStyle = '#E9D5FF'; ctx.beginPath(); ctx.ellipse(-20, 70, 20, 26, 0, 0, 7); ctx.ellipse(20, 70, 20, 26, 0, 0, 7); ctx.fill();
  rr(-28, 110, 56, 90, 24); ctx.fillStyle = '#F9A8D4'; ctx.fill();
  ctx.restore();
}

function nmj(cx, cy, s, ab, t) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);

  ctx.beginPath(); ctx.moveTo(-60, -260); ctx.lineTo(60, -260); ctx.lineTo(60, -120); ctx.quadraticCurveTo(140, -110, 140, -40); ctx.lineTo(-140, -40); ctx.quadraticCurveTo(-140, -110, -60, -120); ctx.closePath();

  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-90 + i * 45, -80, 16, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#CA8A04'; ctx.stroke(); }
  // muscle
  rr(-260, 40, 520, 160, 30); ctx.fillStyle = '#FCA5A5'; ctx.fill();
  ctx.strokeStyle = 'rgba(185,28,28,.3)'; ctx.lineWidth = 4;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-250, 80 + i * 20); ctx.lineTo(250, 80 + i * 20); ctx.stroke(); }
  txt('Muscle', 0, 160, { size: 30, weight: 800, color: '#7F1D1D' });
  // receptors
  for (let i = 0; i < 6; i++) {
    const x = -150 + i * 60;
    rr(x - 12, 24, 24, 26, 6); ctx.fillStyle = '#2563EB'; ctx.fill();
  }
  // ACh molecules drifting
  for (let i = 0; i < 8; i++) {
    const ph = (t * .6 + i / 8) % 1, x = -140 + (i * 37) % 280, y = -36 + ph * 56;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fillStyle = '#16A34A'; ctx.fill();
  }
  // antibodies (Y) docking on receptors
  if (ab > 0) {
    for (let i = 0; i < 6; i++) {
      if (i % 3 === 2) continue;
      const k = clamp(ab * 1.4 - i * .08);
      const x = -150 + i * 60, y = lerp(-20, 4, eo(k));
      ctx.save(); ctx.globalAlpha *= eo(k); ctx.translate(x, y); ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -4); ctx.lineTo(-14, -22); ctx.moveTo(0, -4); ctx.lineTo(14, -22); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

  ctx.strokeStyle = C.mute; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  ctx.restore();
}

// EEG traces. type: 'hyps' | 'ssw' | '3hz' | 'poly' | 'focal' | 'normal'
function eeg(x, y, w, h, type, t, k = 1, ch = 4) {
  ctx.save();
  rr(x, y, w, h, 16); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 3; ctx.stroke();
  ctx.save(); rr(x, y, w, h, 16); ctx.clip();
  ctx.strokeStyle = '#F1F5F9'; ctx.lineWidth = 2;
  for (let gx = x; gx < x + w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke(); }
  const lh = h / ch, N = Math.floor(w * k);
  for (let c = 0; c < ch; c++) {
    const r = rng(31 + c * 7 + type.length * 3), base = y + lh * (c + .5);
    ctx.strokeStyle = type === 'hyps' ? '#B91C1C' : C.ink; ctx.lineWidth = 2.6;
    ctx.beginPath();
    let spikeAt = []; for (let i = 0; i < 40; i++) spikeAt.push(r());
    for (let i = 0; i <= N; i += 2) {
      const u = i / w; let v = 0;
      if (type === 'hyps') {
        v = Math.sin(u * 22 + c) * .55 + Math.sin(u * 9.3 + c * 2) * .45 + (r() - .5) * .5;
        for (const sa of spikeAt.slice(0, 7)) if (Math.abs(u - sa) < .006) v += (r() > .5 ? 1.6 : -1.6);
        v *= 1.0;
      } else if (type === '3hz') {
        const ph = (u * 18) % 1; v = ph < .12 ? -1.4 * Math.sin(ph / .12 * Math.PI) : .8 * Math.sin((ph - .12) / .88 * Math.PI) ;
      } else if (type === 'ssw') {
        const ph = (u * 13) % 1; v = ph < .2 ? -1.0 * Math.sin(ph / .2 * Math.PI) : .6 * Math.sin((ph - .2) / .8 * Math.PI);
      } else if (type === 'poly') {
        const ph = (u * 9) % 1; v = ph < .3 ? Math.sin(ph / .3 * Math.PI * 7) * 1.2 : .5 * Math.sin((ph - .3) / .7 * Math.PI) + (r() - .5) * .1;
        if (u % 0.5 > .25) v = Math.sin(u * 60) * .15 + (r() - .5) * .1;
      } else if (type === 'focal') {
        v = Math.sin(u * 40 + c) * .2 + (r() - .5) * .15;
        if (c === 1) { const ph = (u * 5) % 1; if (ph < .05) v -= Math.sin(ph / .05 * Math.PI) * 1.4; }
      } else { v = Math.sin(u * 50 + c) * .18 + (r() - .5) * .12; }
      const amp = type === 'hyps' ? lh * .42 : lh * .3;
      const px = x + i, py = base + v * amp;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

  ctx.restore();
}

/* ---------- timeline ---------- */
let TL = [];
window.setup = (timeline) => {
  let acc = 0;
  TL = timeline.map(s => { const o = { ...s, cues: s.cues || [], start: acc }; acc += s.dur; return o; });
  return acc;
};
window.renderFrame = (T) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(T);
  let sc = TL[TL.length - 1];
  for (const s of TL) if (T >= s.start && T < s.start + s.dur) { sc = s; break; }
  const t = T - sc.start, D = sc.dur;
  const Q = i => { const c = sc.cues.find(c => c.line === i); return c ? c.t : 0; };
  const R = i => sc.cues.filter(c => c.line === i).map(c => c.t);
  const fin = clamp(t / .35), fout = clamp((D - t) / .3);
  ctx.save(); ctx.globalAlpha = Math.min(fin, fout);
  let cue = null; for (const c of sc.cues) if (t >= c.t) cue = c;
  window.REPEAT = !!(cue && cue.of > 1);
  SC[sc.id](t, D, Q, R);
  ctx.restore();
};
